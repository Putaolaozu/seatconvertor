<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>班级座位表编辑神器</title>
<link rel="stylesheet" href="style.css?v=20261113-1">
<link rel="icon" href="favicon.jpg" type="image/jpeg">
</head>
<body>
<main class="page">
  <div>
    <h1>班级座位表编辑神器</h1>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="dimension-control">
        <label for="rowsInput">行</label>
        <input id="rowsInput" type="number" min="1" max="20" value="7" aria-label="行数" />
        <span class="x">×</span>
        <label for="colsInput">列</label>
        <input id="colsInput" type="number" min="1" max="20" value="8" aria-label="列数" />
      </div>
    </div>
    <div class="toolbar-right">
      <button class="btn undo-btn" id="undoBtn" type="button" aria-label="撤销" title="撤销（Ctrl+Z）" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 7v6h6"></path>
          <path d="M3 13a9 9 0 1 0 2.64-6.36L3 9"></path>
        </svg>
      </button>
      <button class="btn" id="batchAddBtn" type="button">批量添加</button>
      <button class="btn" id="arrangeBtn" type="button" aria-pressed="false">调整座位</button>
      <button class="btn primary" id="rotateBtn" type="button"><span id="rotateLabel">旋转 180°</span></button>
    </div>
  </div>
  <div class="tip-right">
    <h2>
      <span class="cute-tip">点击control+P直接打印，快试试吧~</span>
    </h2>
  </div>
  <div class="statusline">
    <div class="view-state"><span class="state-dot"></span><span id="viewTitle">教师视角</span></div>
  </div>
  <div class="tips">
    <h2>鼠标拖动多选，可批量复制粘贴；</h2>
    <h2>点击“调整座位”后，拖动姓名可以互换座位，点 × 可以暂存姓名。</h2>
  </div>
  <section class="board">
    <div class="stage" id="topStage"><span class="stage-line"></span>讲 台<span class="stage-line"></span></div>
    <div class="grid-wrap">
      <table id="seatTable"></table>
    </div>
    <div class="stage bottom" id="bottomStage" hidden><span class="stage-line"></span><span>讲 台</span><span class="stage-line"></span></div>
    <div class="table-footer">
      <span id="seatCount">7 行 × 8 列</span>
    </div>
  </section>
  <section class="waiting-panel" id="waitingPanel" hidden aria-label="待分配学生">
    <div class="waiting-header">
      <div>
        <h2>待分配区</h2>
        <p id="waitingHint">暂时移出的学生会放在这里。</p>
      </div>
      <div class="waiting-header-right">
        <span class="waiting-count" id="waitingCount">0 人</span>
        <button class="btn clear-waiting-btn" id="clearWaitingBtn" type="button" title="清空待分配区">清空</button>
      </div>
    </div>
    <div class="waiting-list" id="waitingList"></div>
  </section>
  <footer class="site-footer">
    <p>
      Made by 
      <a href="https://github.com/Putaolaozu/seatconvertor" target="_blank" rel="noopener noreferrer" aria-label="putaolaozu 的 GitHub 主页">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        putaolaozu
      </a>
    </p>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 批量添加名单弹窗 -->
<div class="modal-overlay" id="batchModal" hidden>
  <div class="modal-content">
    <h3>批量添加名单</h3>
    <p>请从 Excel 表格中复制一列姓名粘贴到下方，每行一个姓名：</p>
    <textarea id="batchTextarea" rows="7" placeholder="张三&#10;李四&#10;王五&#10;赵六"></textarea>
    <div class="modal-actions">
      <button class="btn primary" id="batchImportBtn" type="button">导入到待分配区</button>
      <button class="btn" id="batchCloseBtn" type="button">关闭</button>
    </div>
  </div>
</div>

<div id="customMenu" class="custom-context-menu">
  <div class="menu-item" id="menuCopy">复制</div>
  <div class="menu-item" id="menuCut">剪切</div>
  <div class="menu-item" id="menuPaste">粘贴</div>
</div>
<script src="script.js?v=20261113-1"></script>
</body>
</html>
