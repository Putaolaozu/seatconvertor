<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>班级座位表视角转换器</title>
<style>
  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --ink: #20211f;
    --muted: #666963;
    --line: #e6e7e2;
    --line-strong: #d5d7d0;
    --accent: #1e5631;
    --accent-hover: #143b21;
    --accent-soft: #eaf1ec;
    --shadow: 0 6px 24px rgba(27, 32, 26, .06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .page { max-width: 1280px; margin: 0 auto; padding: 36px 28px 56px; }
  
  h1 { font-size: 28px; letter-spacing: -.03em; margin: 0 0 16px; font-weight: 700; }

  .toolbar { margin: 0 0 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .toolbar-left, .toolbar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  
  .btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 10px; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { background: #f4f5f1; border-color: #bfc3b9; }
  
  .btn.primary { color: #fff; border-color: var(--accent); background: var(--accent); font-size: 17px; font-weight: 700; padding: 0 24px; height: 48px; box-shadow: 0 4px 14px rgba(30, 86, 49, 0.35); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .dimension-control { display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; height: 44px; font-size: 15px; color: var(--muted); }
  .dimension-control input { width: 40px; border: 0; outline: 0; padding: 0; background: transparent; color: var(--ink); text-align: center; font-weight: 700; font-size: 16px; }
  .dimension-control .x { color: #a3a69d; }

  .statusline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 15px; }
  .view-state { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .state-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }

  .board { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .stage { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 18px 24px; color: var(--muted); font-size: 14px; letter-spacing: .12em; font-weight: 700; }
  .stage-line { width: min(160px, 20%); height: 1px; background: var(--line-strong); }
  .stage.bottom { border-top: 1px dashed var(--line); }
  [hidden] { display: none !important; }

  .grid-wrap { width: 100%; overflow-x: auto; padding: 6px 20px 24px; }
  table { width: 100%; min-width: 850px; table-layout: fixed; border-collapse: separate; border-spacing: 8px; }
  thead th { color: #82857d; font-size: 13px; font-weight: 700; padding: 0 0 4px; text-align: center; white-space: nowrap; }
  thead th:first-child { width: 65px; }
  tbody th { color: #8f928a; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; }
  td { padding: 0; height: 84px; vertical-align: stretch; }
  
  .seat { width: 100%; height: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 10px; background: #fdfdfc; display: flex; align-items: center; justify-content: center; padding: 8px; text-align: center; overflow-wrap: anywhere; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; transition: border-color .12s, box-shadow .12s, background .12s; font-size: 17px; font-weight: 500; }
  .seat:hover { border-color: #c4c9bf; background: #fff; }
  .seat:focus { border-color: #1e5631; box-shadow: 0 0 0 3px rgba(30, 86, 49, 0.15); background: #fff; }
  .seat.has-text { font-weight: 600; }
  .seat.range-selected { background: #eaf1ec; border-color: #1e5631; box-shadow: inset 0 0 0 1px #1e5631; }
  body.dragging-seats, body.dragging-seats * { user-select: none !important; cursor: crosshair !important; }
  .seat { caret-color: var(--accent); }

  .table-footer { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 10px); opacity: 0; pointer-events: none; background: #232923; color: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); transition: opacity .18s, transform .18s; z-index: 5; font-size: 15px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 700px) {
    .page { padding: 16px 12px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-left, .toolbar-right { width: 100%; justify-content: space-between; }
    .toolbar-right .btn { flex: 1; }
  }
  @media print {
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .toolbar, .table-footer { display: none; }
    .board { box-shadow: none; }
    .seat { print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main class="page">
  <div>
    <h1>班级座位表视角转换器</h1>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="dimension-control">
        <span>行</span><input id="rowsInput" type="number" min="1" max="20" value="7" />
        <span class="x">×</span>
        <span>列</span><input id="colsInput" type="number" min="1" max="20" value="8" />
      </div>
    </div>
    <div class="toolbar-right">
      <button class="btn" id="copyGrid" type="button">复制表格</button>
      <button class="btn primary" id="rotateBtn" type="button"><span id="rotateLabel">旋转 180°</span></button>
    </div>
  </div>

  <div class="statusline">
    <div class="view-state"><span class="state-dot"></span><span id="viewTitle">教师视角</span></div>
  </div>

  <section class="board">
    <div class="stage" id="topStage"><span class="stage-line"></span><span>讲 台</span><span class="stage-line"></span></div>
    <div class="grid-wrap">
      <table id="seatTable"></table>
    </div>
    <div class="stage bottom" id="bottomStage" hidden><span class="stage-line"></span><span>讲 台</span><span class="stage-line"></span></div>
    <div class="table-footer">
      <span id="seatCount">7 行 × 8 列</span>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const STORAGE_KEY = 'classroom-seat-view-converter-v6';
  const MAX_SIZE = 20;
  let rows = 7;
  let cols = 8;
  let seats = Array.from({ length: rows }, () => Array(cols).fill(''));
  let studentView = false;
  let toastTimer;
  let pointerDown = null;
  let dragSelecting = false;
  let selectionRange = null;
  let lastFocusedCell = { r: 0, c: 0 };

  const table = document.getElementById('seatTable');
  const rowsInput = document.getElementById('rowsInput');
  const colsInput = document.getElementById('colsInput');
  const viewTitle = document.getElementById('viewTitle');
  const rotateLabel = document.getElementById('rotateLabel');
  const topStage = document.getElementById('topStage');
  const bottomStage = document.getElementById('bottomStage');
  const seatCount = document.getElementById('seatCount');
  const toast = document.getElementById('toast');

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows, cols, seats, studentView })); }
    catch (_) { }
  }

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!saved || !Array.isArray(saved.seats)) return;
      rows = Math.max(1, Math.min(MAX_SIZE, Number(saved.rows) || 7));
      cols = Math.max(1, Math.min(MAX_SIZE, Number(saved.cols) || 8));
      seats = Array.from({ length: rows }, (_, r) => 
        Array.from({ length: cols }, (_, c) => String(saved.seats?.[r]?.[c] ?? '').replace(/[\r\n]/g, ' ').trim())
      );
      studentView = Boolean(saved.studentView);
    } catch (_) { }
  }

  function render() {
    rowsInput.value = rows;
    colsInput.value = cols;
    viewTitle.textContent = studentView ? '学生视角 (已旋转 180°)' : '教师视角';
    rotateLabel.textContent = studentView ? '恢复视角' : '旋转 180°';
    topStage.hidden = !studentView;
    bottomStage.hidden = studentView;
    seatCount.textContent = `${rows} 行 × ${cols} 列 · 共 ${rows * cols} 座位`;

    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.textContent = '';
    headerRow.appendChild(corner);
    for (let c = 0; c < cols; c++) {
      const th = document.createElement('th');
      const colNum = studentView ? cols - c : c + 1;
      th.textContent = `第${colNum}列`;
      headerRow.appendChild(th);
    }
    thead.appendChild(headerRow);

    const tbody = document.createElement('tbody');
    for (let r = 0; r < rows; r++) {
      const tr = document.createElement('tr');
      const rowHead = document.createElement('th');
      const rowNum = studentView ? rows - r : r + 1;
      rowHead.textContent = `第${rowNum}行`;
      tr.appendChild(rowHead);
      for (let c = 0; c < cols; c++) {
        const td = document.createElement('td');
        const editor = document.createElement('div');
        editor.className = 'seat' + (seats[r][c] ? ' has-text' : '') + (isInSelection(r, c) ? ' range-selected' : '');
        editor.contentEditable = 'true';
        editor.spellcheck = false;
        editor.dataset.r = String(r);
        editor.dataset.c = String(c);
        editor.textContent = seats[r][c];
        td.appendChild(editor);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.replaceChildren(thead, tbody);
    saveState();
  }

  function isInSelection(r, c) {
    if (!selectionRange) return false;
    return r >= selectionRange.top && r <= selectionRange.bottom && c >= selectionRange.left && c <= selectionRange.right;
  }

  function normalizeRange(a, b) {
    return {
      top: Math.min(a.r, b.r),
      left: Math.min(a.c, b.c),
      bottom: Math.max(a.r, b.r),
      right: Math.max(a.c, b.c)
    };
  }

  function paintSelection() {
    table.querySelectorAll('.seat').forEach(cell => {
      cell.classList.toggle('range-selected', isInSelection(Number(cell.dataset.r), Number(cell.dataset.c)));
    });
  }

  function selectedAreaSize() {
    if (!selectionRange) return 1;
    return (selectionRange.bottom - selectionRange.top + 1) * (selectionRange.right - selectionRange.left + 1);
  }

  function resizeGrid(newRows, newCols) {
    selectionRange = null;
    rows = Math.max(1, Math.min(MAX_SIZE, Math.floor(Number(newRows) || 1)));
    cols = Math.max(1, Math.min(MAX_SIZE, Math.floor(Number(newCols) || 1)));
    seats = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => seats[r]?.[c] ?? ''));
    render();
  }

  function focusCell(r, c, preserveRange = false) {
    if (r < 0 || c < 0 || r >= rows || c >= cols) return;
    if (!preserveRange && selectionRange) { selectionRange = null; paintSelection(); }
    const next = table.querySelector(`.seat[data-r="${r}"][data-c="${c}"]`);
    if (next) {
      next.focus();
      const range = document.createRange();
      range.selectNodeContents(next);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function pasteMatrix(startR, startC, matrix) {
    const pasteRows = matrix.length;
    const pasteCols = Math.max(1, ...matrix.map(line => line.length));
    const targetRows = Math.min(MAX_SIZE, Math.max(rows, startR + pasteRows));
    const targetCols = Math.min(MAX_SIZE, Math.max(cols, startC + pasteCols));

    if (targetRows !== rows || targetCols !== cols) {
      seats = Array.from({ length: targetRows }, (_, r) => Array.from({ length: targetCols }, (_, c) => seats[r]?.[c] ?? ''));
      rows = targetRows;
      cols = targetCols;
    }

    matrix.forEach((line, r) => {
      line.forEach((value, c) => {
        const rr = startR + r;
        const cc = startC + c;
        if (rr < rows && cc < cols) {
          seats[rr][cc] = String(value || '').replace(/[\r\n]/g, ' ').trim();
        }
      });
    });

    selectionRange = null;
    render();
    focusCell(Math.min(rows - 1, startR + pasteRows - 1), Math.min(cols - 1, startC + pasteCols - 1));
    showToast(`已粘贴 ${pasteRows} 行 × ${pasteCols} 列`);
  }

  table.addEventListener('focusin', event => {
    const editor = event.target.closest('.seat');
    if (editor) lastFocusedCell = { r: Number(editor.dataset.r), c: Number(editor.dataset.c) };
  });

  table.addEventListener('input', event => {
    const editor = event.target.closest('.seat');
    if (!editor) return;
    const r = Number(editor.dataset.r), c = Number(editor.dataset.c);
    seats[r][c] = editor.textContent.replace(/[\r\n]/g, ' ').trim();
    editor.classList.toggle('has-text', Boolean(seats[r][c]));
    lastFocusedCell = { r, c };
    if (selectionRange) { selectionRange = null; paintSelection(); }
    saveState();
  });

  rowsInput.addEventListener('change', () => resizeGrid(rowsInput.value, cols));
  colsInput.addEventListener('change', () => resizeGrid(rows, colsInput.value));

  document.addEventListener('paste', event => {
    const active = document.activeElement?.closest?.('.seat');
    if (!active && !selectionRange) return;
    const clipboard = event.clipboardData;
    if (!clipboard) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    let matrix = [];
    const htmlText = clipboard.getData('text/html');
    if (htmlText && htmlText.includes('<table')) {
      try {
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
        doc.querySelectorAll('tr').forEach(tr => {
          const rowData = [];
          tr.querySelectorAll('td, th').forEach(cell => rowData.push(cell.textContent.trim()));
          if (rowData.length > 0) matrix.push(rowData);
        });
      } catch (_) {}
    }

    if (matrix.length === 0) {
      const text = clipboard.getData('text/plain');
      if (text) {
        const lines = text.replace(/\r\n?/g, '\n').split('\n');
        if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
        matrix = lines.map(line => line.split('\t').map(x => x.trim()));
      }
    }

    if (matrix.length === 0) return;

    const startR = selectionRange ? selectionRange.top : (active ? Number(active.dataset.r) : lastFocusedCell.r);
    const startC = selectionRange ? selectionRange.left : (active ? Number(active.dataset.c) : lastFocusedCell.c);

    if (selectionRange && selectedAreaSize() > 1 && matrix.length === 1 && matrix[0].length === 1) {
      const plainText = matrix[0][0];
      const range = { ...selectionRange };
      let count = 0;
      for (let r = range.top; r <= range.bottom; r++) {
        for (let c = range.left; c <= range.right; c++) {
          if (r < rows && c < cols) { seats[r][c] = plainText; count++; }
        }
      }
      selectionRange = null;
      render();
      focusCell(range.top, range.left);
      showToast(`已向 ${count} 个座位填入`);
      return;
    }

    pasteMatrix(startR, startC, matrix);
  }, true);

  table.addEventListener('mousedown', event => {
    const editor = event.target.closest('.seat');
    if (!editor || event.button !== 0) return;
    pointerDown = { r: Number(editor.dataset.r), c: Number(editor.dataset.c), x: event.clientX, y: event.clientY };
    lastFocusedCell = { r: pointerDown.r, c: pointerDown.c };
    dragSelecting = false;
  });

  document.addEventListener('mousemove', event => {
    if (!pointerDown || !(event.buttons & 1)) return;
    if (!dragSelecting && Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y) < 4) return;
    dragSelecting = true;
    document.body.classList.add('dragging-seats');
    event.preventDefault();
    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.seat');
    if (!target || !table.contains(target)) return;
    window.getSelection()?.removeAllRanges();
    selectionRange = normalizeRange(pointerDown, { r: Number(target.dataset.r), c: Number(target.dataset.c) });
    paintSelection();
  });

  document.addEventListener('mouseup', () => {
    if (!pointerDown) return;
    document.body.classList.remove('dragging-seats');
    if (!dragSelecting) { selectionRange = null; paintSelection(); }
    pointerDown = null;
    dragSelecting = false;
  });

  table.addEventListener('keydown', event => {
    const editor = event.target.closest('.seat');
    if (!editor) return;
    const r = Number(editor.dataset.r), c = Number(editor.dataset.c);
    if (selectionRange && selectedAreaSize() > 1 && (event.key === 'Delete' || event.key === 'Backspace')) {
      event.preventDefault();
      const range = { ...selectionRange };
      for (let rr = range.top; rr <= range.bottom; rr++) {
        for (let cc = range.left; cc <= range.right; cc++) seats[rr][cc] = '';
      }
      selectionRange = null;
      render();
      focusCell(range.top, range.left);
      showToast('已清空所选座位');
      return;
    }
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      focusCell(Math.min(rows - 1, r + 1), c);
    } else if (event.key === 'Tab') {
      event.preventDefault();
      const next = event.shiftKey ? (r * cols + c - 1) : (r * cols + c + 1);
      const bounded = Math.max(0, Math.min(rows * cols - 1, next));
      focusCell(Math.floor(bounded / cols), bounded % cols);
    }
  });

  document.getElementById('rotateBtn').addEventListener('click', () => {
    seats.reverse();
    seats.forEach(row => row.reverse());
    selectionRange = null;
    studentView = !studentView;
    render();
  });

  document.getElementById('copyGrid').addEventListener('click', async () => {
    const text = seats.map(row => row.join('\t')).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      showToast('表格已复制');
    } catch (_) {
      showToast('复制失败');
    }
  });

  loadState();
  render();
})();
</script>
</body>
</html>
