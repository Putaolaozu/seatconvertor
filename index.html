<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>班级座位表编辑神器</title>
<link rel="stylesheet" href="style.css?v=20261113-clean1">
<link rel="icon" href="favicon.jpg" type="image/jpeg">
</head>
<body>
<main class="page">
  <h1>班级座位表编辑神器</h1>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="dimension-control">
        <label for="rowsInput">行</label>
        <input id="rowsInput" type="number" min="1" max="20" value="7" aria-label="行数" />
        <span class="x">×</span>
        <label for="colsInput">列</label>
        <input id="colsInput" type="number" min="1" max="20" value="8" aria-label="列数" />
      </div>
      <button class="btn" id="batchAddBtn" type="button" title="批量添加名单">批量添加</button>
    </div>
    <div class="toolbar-right">
      <button class="btn undo-btn" id="undoBtn" type="button" aria-label="撤销" title="撤销（Ctrl+Z）" disabled>
        <span class="icon icon-undo" aria-hidden="true"></span>
      </button>
      <button class="btn" id="arrangeBtn" type="button" aria-pressed="false" title="点击开启调整座位功能">调整座位</button>
      <button class="btn primary" id="rotateBtn" type="button" title="旋转座位表视角°"><span id="rotateLabel">旋转 180°</span></button>
    </div>
  </div>

  <div class="tip-right">
    <button class="btn" id="printBtn" type="button" title="打印座位表（control+P）">打印</button>
  </div>
  
  <div class="tips">
    <h2>鼠标拖动多选，可批量复制粘贴；</h2>
    <h2>点击“调整座位”后，拖动姓名可以互换座位，点“ — ”可以暂存姓名。</h2>
  </div>
  <div class="statusline">
    <div class="view-state"><span class="state-dot"></span><span id="viewTitle">教师视角</span></div>
  </div>
  <section class="board">
    <div class="stage-area" id="topStageArea">
      <div class="stage">
        <button class="stage-add-btn" data-side="left" title="在此添加座位" type="button">+</button>
        <div class="extra-seats-group left" id="leftExtraTop"></div>
        <div class="stage-center">讲 台</div>
        <div class="extra-seats-group right" id="rightExtraTop"></div>
        <button class="stage-add-btn" data-side="right" title="在此添加座位" type="button">+</button>
      </div>
    </div>

    <div class="grid-wrap"><table id="seatTable"></table></div>

    <div class="stage-area" id="bottomStageArea" hidden>
      <div class="stage bottom">
        <button class="stage-add-btn" data-side="left" title="在此添加座位" type="button">+</button>
        <div class="extra-seats-group left" id="leftExtraBottom"></div>
        <div class="stage-center"><span>讲 台</span></div>
        <div class="extra-seats-group right" id="rightExtraBottom"></div>
        <button class="stage-add-btn" data-side="right" title="在此添加座位" type="button">+</button>
      </div>
    </div>

    <div class="table-footer"><span id="seatCount">7 行 × 8 列</span></div>
  </section>

  <section class="waiting-panel" id="waitingPanel" hidden aria-label="待分配学生">
    <div class="waiting-header">
      <div>
        <h2>待分配区</h2>
        <p id="waitingHint">暂时移出的学生会放在这里。</p>
      </div>
      <div class="waiting-header-right">
        <span class="waiting-count" id="waitingCount">0 人</span>
        <button class="btn clear-waiting-btn" id="clearWaitingBtn" type="button" title="清空待分配区">清空</button>
      </div>
    </div>
    <div class="waiting-list" id="waitingList"></div>
  </section>

  <footer class="site-footer">
    <p>
      Made by
      <a href="https://github.com/Putaolaozu/seatconvertor" target="_blank" rel="noopener noreferrer" aria-label="putaolaozu 的 GitHub 主页">
        <img src="icons/github.svg" width="16" height="16" alt="" aria-hidden="true">
        putaolaozu
      </a>
    </p>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal-overlay" id="batchModal" hidden>
  <div class="modal-content">
    <h3>批量添加名单</h3>
    <p>请从 Excel 表格中复制一列姓名粘贴到下方，每行一个姓名：</p>
    <textarea id="batchTextarea" rows="7" placeholder="张三&#10;李四&#10;王五&#10;赵六"></textarea>
    <div class="modal-actions">
      <button class="btn primary" id="batchImportBtn" type="button">导入到待分配区</button>
      <button class="btn" id="batchCloseBtn" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="clearModal" hidden>
  <div class="modal-content clear-modal-content">
    <h3>清空确认</h3>
    <p>确定要清空待分配区的所有学生吗？此操作可按 Ctrl+Z 撤销。</p>
    <div class="modal-actions clear-modal-actions">
      <button class="btn primary danger-btn" id="confirmClearBtn" type="button">确定清空</button>
      <button class="btn" id="cancelClearBtn" type="button">取消</button>
    </div>
  </div>
</div>

<template id="tplRemoveSeatBtn">
  <button type="button" class="remove-seat" title="移至待分配区">
    <span class="icon icon-minus" aria-hidden="true"></span>
  </button>
</template>
<template id="tplCrossBtn">
  <button type="button">
    <span class="icon icon-cross" aria-hidden="true"></span>
  </button>
</template>

<div id="customMenu" class="custom-context-menu">
  <div class="menu-item" id="menuCopy">复制</div>
  <div class="menu-item" id="menuCut">剪切</div>
  <div class="menu-item" id="menuPaste">粘贴</div>
</div>

<script src="script.js?v=20261113-clean1"></script>
</body>
</html>
